<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Traces</title>
  <style>
      :root {
          color-scheme: dark;
          --bg: #22252b;
          --bg-deep: #1b1e23;
          --text: #dfe2e7;
          --muted: #858b96;
          --muted-2: #6f7581;
          --line: #363b44;
          --grid: #343941;
      }

      * {
          box-sizing: border-box;
      }

      html,
      body {
          height: 100%;
      }

      body {
          margin: 0;
          padding: 8px;
          overflow: hidden;
          background: #17191e;
          color: var(--text);
          font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
          font-size: 13px;
          -webkit-font-smoothing: antialiased;
      }

      .shell {
          display: flex;
          flex-direction: column;
          height: calc(100vh - 16px);
          overflow: hidden;
          border: 1px solid #3b4049;
          background: var(--bg);
      }

      .topbar {
          display: flex;
          flex: 0 0 49px;
          min-width: 0;
          border-bottom: 1px solid var(--line);
      }

      .meta {
          display: flex;
          flex: 0 0 232px;
          align-items: center;
          gap: 7px;
          min-width: 0;
          padding: 0 14px;
          overflow: hidden;
          border-right: 1px solid var(--line);
      }

      .start-label {
          flex: 0 0 auto;
          color: var(--muted);
          font-size: 12px;
          white-space: nowrap;
      }

      .start-date {
          flex: 1;
          min-width: 0;
          overflow: hidden;
          color: #aeb4bf;
          font-size: 12px;
          text-overflow: ellipsis;
          white-space: nowrap;
      }

      .search-btn {
          display: flex;
          flex: 0 0 auto;
          align-items: center;
          justify-content: center;
          width: 20px;
          height: 20px;
          padding: 0;
          border: 0;
          background: transparent;
          color: var(--muted);
          cursor: pointer;
      }

      .search-btn:hover {
          color: var(--text);
      }

      .search-btn svg {
          width: 15px;
          height: 15px;
      }

      .btn-group {
          display: flex;
          flex: 0 0 auto;
          align-items: center;
          overflow: hidden;
          border: 1px solid var(--line);
          border-radius: 3px;
      }

      .btn {
          min-width: 22px;
          height: 22px;
          padding: 0 6px;
          border: 0;
          background: var(--bg-deep);
          color: var(--text);
          font: inherit;
          font-size: 12px;
          cursor: pointer;
      }

      .btn:hover {
          background: #30353e;
      }

      .btn-label {
          min-width: 30px;
          color: var(--muted);
          font-size: 10px;
          text-align: center;
      }

      .mach-times {
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 1px;
          margin-left: auto;
          color: var(--muted);
          font-size: 9px;
          line-height: 1.15;
          white-space: pre;
          font-family: monospace;
      }

      .search-input {
          flex: 1;
          min-width: 0;
          padding: 4px 6px;
          border: 1px solid var(--line);
          border-radius: 3px;
          outline: none;
          background: var(--bg-deep);
          color: var(--text);
          font: inherit;
          font-size: 12px;
      }

      .search-input:focus {
          border-color: #56606d;
      }

      .ruler {
          position: relative;
          flex: 1;
          min-width: 0;
          margin: 0 16px;
      }

      .ruler-label {
          position: absolute;
          top: 7px;
          color: var(--muted);
          font-size: 11px;
          white-space: nowrap;
          transform: translateX(-50%);
      }

      .tick {
          position: absolute;
          top: 29px;
          bottom: 0;
          width: 1px;
          background: var(--grid);
      }

      .rows {
          flex: 1;
          min-height: 0;
          overflow-x: hidden;
          overflow-y: auto;
      }

      .row {
          display: flex;
          min-height: 30px;
      }

      .row:hover {
          background: rgba(255, 255, 255, 0.018);
      }

      .state {
          padding-left: 20px;
          position: relative;
          display: flex;
          flex: 0 0 232px;
          align-items: center;
          min-width: 0;
          border-right: 1px solid var(--line);
      }

      .state-body {
          width: 100%;
          min-width: 0;
      }

      .state-head {
          display: flex;
          align-items: center;
          gap: 6px;
          min-width: 0;
      }

      .dot {
          flex: 0 0 auto;
          width: 8px;
          height: 8px;
          border-radius: 50%;
      }

      .name {
          overflow: hidden;
          color: var(--text);
          font-size: 13px;
          text-overflow: ellipsis;
          white-space: nowrap;
      }

      .track {
          position: relative;
          flex: 1;
          min-width: 0;
          margin: 0 16px;
          background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px);
          background-size: 25% 100%;
          border-right: 1px solid var(--grid);
      }

      .track::after {
          position: absolute;
          top: 26px;
          right: 0;
          left: 0;
          border-top: 1px solid rgba(70, 76, 86, 0.45);
          content: "";
          pointer-events: none;
      }

      .bar {
          position: absolute;
          top: 8px;
          height: 9px;
          min-width: 2px;
          border-radius: 3px;
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }

      .now-line {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 2px;
          background: #e6c84f;
          opacity: 0.85;
          pointer-events: none;
          z-index: 2;
      }

      .bar-cap {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          width: 7px;
          border-radius: 3px 0 0 3px;
          background: rgba(255, 255, 255, 0.45);
      }

      .empty {
          padding: 28px 18px;
          color: var(--muted);
          font-size: 12px;
      }

      @media (max-width: 700px) {
          .meta,
          .event {
              flex-basis: 180px;
          }
      }
  </style>
</head>
<body>
{{body}}
</body>
</html>
