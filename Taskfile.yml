version: '3'

dotenv: [ '.env' ]

env:
  GOFMT: gofumpt

includes:
  local:
    taskfile: ./.local/Taskfile.yml
    optional: true

tasks:

  build:
    desc: Build the project, but don't create files
    cmds:
      - task: link-pubsub
      - go build -o /dev/null $(go list ./examples/...
          | grep -v -E '/(wasm/client|fsm|nfa|temporal_expense)')
      - go build -o /dev/null ./pkg/...
      - cd ./pkg/pubsub && go build -o /dev/null ./...
      - go build -o /dev/null ./internal/...
      - go build -o /dev/null ./tools/...

  build-wasm:
    desc: Build the project for WASM, but don't create files
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      # dedicated go.mod
      - cd ./examples/wasm_workflow &&
          go build -o /dev/null ./...
      - cd ./examples/wasm &&
          go build -o /dev/null ./...
      # root go.mod
      - go build -o /dev/null ./pkg/machine/...
      - go build -o /dev/null ./pkg/rpc/...
      - go build -o /dev/null ./pkg/helpers/...

  build-am-dbg:
    ignore_error: true
    cmd: go build -o dist ./tools/cmd/am-dbg

  build-am-dbg-wasm:
    env:
      GOOS: js
      GOARCH: wasm
    cmd: go build -o ./dist/webfiles/main.wasm ./tools/cmd/am-dbg

  build-arpc:
    ignore_error: true
    cmd: go build -o dist ./tools/cmd/arpc

  docker-web-am-dbg:
    env:
      DOCKER_BUILDKIT: 1
    cmd: docker build -t asyncmachine/web-am-dbg
      -f deploy/web-am-dbg/Dockerfile ..

  docker-web-am-dbg-start:
    env:
      AM_REPL_DIR: /data
    vars:
      AM_REPL_DIR: '{{.AM_REPL_DIR | default "./tmp"}}'
      AM_DBG_BASE_PATH: '{{.AM_DBG_BASE_PATH | default "/"}}'
    ignore_error: true
    cmds:
      - task: docker-web-am-dbg-stop
      - docker run
          --volume {{.AM_REPL_DIR}}:/data
          -e AM_REPL_DIR=/data
          -e AM_DBG_ADDR=0.0.0.0:6831
          -e AM_DBG_BASE_PATH={{.AM_DBG_BASE_PATH}}
          --name am-dbg
          --publish 7681:7681
          --publish 6831:6831
          -it
          asyncmachine/web-am-dbg

  docker-web-am-dbg-stop:
    ignore_error: true
    cmds:
      - docker stop am-dbg
      - docker rm am-dbg

  release: goreleaser release --clean --skip publish --skip validate

  assets: git submodule update --init --recursive

  am-gen: go run ./tools/cmd/am-gen {{.CLI_ARGS}}

  am-dbg:
    silent: false
    cmds:
      - go run ./tools/cmd/am-dbg --clean-on-connect --max-mem 1000
        --dir tmp
        {{.CLI_ARGS}}

  am-dbg-narrow: task am-dbg -- --view-narrow
  am-dbg-reader: task am-dbg -- --view-narrow --view-reader

  am-dbg-race:
    silent: false
    env:
      GORACE: "log_path=tmp/am-dbg-race.log"
    cmds:
      - go run -race ./tools/cmd/am-dbg --clean-on-connect --max-mem 1000
        --dir tmp --dbg-race
        {{.CLI_ARGS}}

  am-dbg-prof:
    desc: Profile am-dbg
    silent: false
    cmds:
      - go run ./tools/cmd/am-dbg
        --clean-on-connect
        --prof-srv :6060
        --dir tmp
        {{.CLI_ARGS}}

  am-dbg-prof2:
    desc: Profile and debug am-dbg
    silent: false
    cmds:
      - go run ./tools/cmd/am-dbg
        --clean-on-connect
        --prof-srv :6060
        --dbg-am-dbg-addr localhost:9913
        --dir tmp
        {{.CLI_ARGS}}

  am-dbg-asset:
    desc: Start am-dbg with an asset dump file
    silent: false
    cmds:
      - go run ./tools/cmd/am-dbg
          --import-data assets/asyncmachine-go/am-dbg-exports/secai-cook.gob.br
          --select-machine sim-p0
          --select-transition 20
          --max-mem 1000
          --dir tmp
          -l -1
          {{.CLI_ARGS}}

  am-dbg-ssh:
    ignore_error: true
    cmd: ssh localhost -p 6833 
      -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

  am-dbg-ssh-force: ssh force@localhost -p 6833 
    -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

  am-dbg-ssh-auto:
    ignore_error: true
    desc: Connect to am-dbg via SSH and keep reconnecting
    cmd: |
      while true; do
        task am-dbg-ssh
        sleep 3
      done

  am-dbg-dump:
    desc: Start am-dbg with a recent dump file
    silent: false
    cmd:  go run ./tools/cmd/am-dbg
        --import-data tmp/am-dbg-dump.gob.br
        --dir tmp
        {{.CLI_ARGS}}

  am-dbg-import:
    silent: false
    requires:
      vars: [ FILE ]
    cmd: go run ./tools/cmd/am-dbg
        --dir tmp
        -l -1
        --import-data {{.FILE}}
        {{.CLI_ARGS}}

  am-dbg-dbg:
    desc: Start am-dbg on port 9913, so it can debug other instances via --dbg-am-dbg-addr
    silent: false
    cmd: go run ./tools/cmd/am-dbg
        --listen-addr localhost:9913
        --select-connected
        --log-ops-ttl 5m
        --max-mem 2000
        --view-narrow
        --filter-queued
        --filter-canceled
        --dir tmp2
        {{.CLI_ARGS}}

  am-dbg-dbg-prof:
    desc: Profile am-dbg-dbg
    cmd: go run ./tools/cmd/am-dbg
        --listen-addr localhost:9913
        --select-connected
        --log-ops-ttl 5m
        --prof-srv :6050
        {{.CLI_ARGS}}

  am-dbg-worker:
    desc: Run am-dbg as an RPC worker, optionally starting the dbg RPC server via -server-addr
    silent: false
    cmd: go run ./internal/testing/cmd/am-dbg-worker
        -server-addr=localhost:53470
        -worker-addr=localhost:53480

  am-dbg-delve:
    silent: false
    env:
      AM_DEBUG: 1
    cmds:
      - dlv debug --headless
        --listen=:2345 --api-version=2 --accept-multiclient
        ./tools/cmd/am-dbg -- 
          --clean-on-connect 
          --dbg-log-level 3
          --dbg-am-dbg-addr localhost:9913
          --dir tmp
          {{.CLI_ARGS}}

  am-dbg-dbg-delve:
    silent: false
    env:
      AM_DEBUG: 1
    cmd: dlv debug --headless
        --listen=:2346 --api-version=2 --accept-multiclient
        ./tools/cmd/am-dbg -- 
          --listen-addr localhost:9913
          --select-connected
          --log-ops-ttl 5m
          --max-mem 2000
          --dir tmp2
          {{.CLI_ARGS}}

  tui-db-sql: squall pkg/history/gorm/amhist.sqlite

  tui-db-bolt: bboltEdit pkg/history/bbolt/amhist.db

  test:
    env:
      AM_TEST_RUNNER: 1
    desc: Run all simple tests
    cmds:
      - task: link-pubsub
      - task: build-wasm
      - task: clean-test
      - go test ./... {{.CLI_ARGS}}
      - cd ./pkg/pubsub && go test ./... {{.CLI_ARGS}}

  test-all:
    env:
      AM_TEST_RUNNER: 1
    desc: Run simple and integration tests
    cmds:
      - task: link-pubsub
      - task: build-wasm
      - task: clean-test
      - go test -tags integration ./... {{.CLI_ARGS}}
      - cd ./pkg/pubsub && go test -tags integration ./... {{.CLI_ARGS}}

  test-integration:
    env:
      AM_TEST_RUNNER: 1
    desc: Run only integration tests
    cmds:
      - task: link-pubsub
      - task: test-integration-dbg
      - task: test-integration-wasm
      - task: clean-test
      - go test -tags integration
          -p 1 --parallel 1
          ./examples/arpc
          ./examples/basic
          ./examples/cli
          ./examples/cli_daemon
          ./examples/dag_dependency_graph
          ./examples/fan_out_in
          ./examples/mach_template
          ./examples/pipes
          ./examples/raw_strings
          ./examples/subscriptions
          ./pkg/helpers/new
          ./pkg/history/gorm
          ./pkg/graph/test
          ./pkg/rpc/test
          ./pkg/rpc/iroh
          {{.CLI_ARGS}}
      - cd ./pkg/pubsub && go test -tags integration -p 1 --parallel 1 ./...

  test-integration-dbg:
    env:
      AM_TEST_RUNNER: 1
    desc: Run debugger integration tests
    cmds:
      - task: clean-test
      - go test -tags integration
        -p 1 --parallel 1
        ./tools/debugger/test
        {{.CLI_ARGS}}

  test-rpc-wasm:
    env:
      AM_TEST_RUNNER: 1
    desc: Run pkg/rpc/test in browser WASM via gobwas/ws
    cmds:
      - go test -tags integration ./pkg/rpc/test -run '^TestWasmRPC$'
          -v -count=1 {{.CLI_ARGS}}

  test-integration-wasm:
    env:
      AM_TEST_RUNNER: 1
    desc: Run WASM example integration tests
    cmds:
      - task: clean-test
      - task: test-rpc-wasm
      - cmd: '{{.TASK_EXE}} tidy-examples-wasm'
        ignore_error: true
      - cd examples/wasm && go test -tags integration . {{.CLI_ARGS}}
      - cd examples/wasm_workflow && go test -tags integration . {{.CLI_ARGS}}
      - cd examples/wasm_livepage && go test -tags integration -run '^TestWasmLivepage$' . {{.CLI_ARGS}}

  test-path:
    env:
      AM_TEST_RUNNER: 1
    desc: Run tests for a provided path
    cmds:
      - task: clean-test
      - go test {{.CLI_ARGS}}
      - go test -race -timeout 1m {{.CLI_ARGS}}

  test-pubsub:
    env:
      AM_TEST_RUNNER: 1
    desc: Run /pkg/pubsub tests (dedicated go.mod)
    dir: pkg/pubsub
    cmds:
      - task: link-pubsub
      - go test ./... {{.CLI_ARGS}}
      - go test -race -timeout 1m ./... {{.CLI_ARGS}}

  test-pubsub-integration:
    env:
      AM_TEST_RUNNER: 1
    desc: Run /pkg/pubsub integration tests (dedicated go.mod)
    dir: pkg/pubsub
    cmds:
      - task: link-pubsub
      - go test -tags integration -p 1 --parallel 1 ./... {{.CLI_ARGS}}

  link-pubsub:
    desc: Link /pkg/pubsub to the monorepo (dev and CI only)
    dir: pkg/pubsub
    cmds:
      - test -f go.work || cp go.work.example go.work
      - go work use . ../..

  tidy:
    desc: go root mod tidy with temporary monorepo links
    cmds:
      - task: script-goworkmod
        vars: {CLI_ARGS: 'apply -work .. -tidy'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'revert -work ..'}

  tidy-all:
    cmds:
      - task: tidy
      - task: tidy-pubsub
      - task: tidy-examples-wasm

  tidy-pubsub:
    desc: Tidy /pkg/pubsub with a temporary monorepo link
    cmds:
      - task: script-goworkmod
        vars: {CLI_ARGS: 'apply -work ../pkg/pubsub -tidy'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'revert -work ../pkg/pubsub'}

  tidy-examples-wasm:
    desc: Tidy /examples/wasm* with temporary monorepo links
    cmds:
      - task: script-goworkmod
        vars: {CLI_ARGS: 'apply -work ../examples/wasm -tidy'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'revert -work ../examples/wasm'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'apply -work ../examples/wasm_workflow -tidy'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'revert -work ../examples/wasm_workflow'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'apply -work ../examples/wasm_livepage -tidy'}
      - task: script-goworkmod
        vars: {CLI_ARGS: 'revert -work ../examples/wasm_livepage'}

  script-goworkmod:
    desc: Run ./scripts/goworkmod, eg "task script-goworkmod -- apply -work .. -tidy"
    dir: scripts
    cmds:
      - GOWORK=off go run ./goworkmod {{.CLI_ARGS}}

  test-tinygo:
    env:
      AM_TEST_RUNNER: 1
    desc: Run pkg/machine tests in TinyGo (safe build tag required by testify)
    cmds:
      - tinygo test -tags safe {{.CLI_ARGS}} ./pkg/machine

  test-tinygo-rpc:
    env:
      AM_TEST_RUNNER: 1
    desc: Run pkg/rpc tests in TinyGo
    cmds:
      - tinygo test -tags safe -parallel 1 {{.CLI_ARGS}} ./pkg/rpc/test

  test-integration-path:
    env:
      AM_TEST_RUNNER: 1
    desc: Run tests for a provided path
    cmds:
      - task: clean-test
      - go test -tags integration {{.CLI_ARGS}}
      - go test -tags integration -race -timeout 1m {{.CLI_ARGS}}

  test-pkg:
    desc: Run tests for a specific package
    cmd: task test-path -- ./pkg/{{.CLI_ARGS}}

  test-count:
    cmd: grep -r --include="*_test.go"  "^func Test" ./ | wc -l > tests.txt

  test-count-pkg:
    cmd: grep -r --include="*_test.go"  "^func Test" ./pkg | wc -l > tests-pkg.txt

  test-coverage-tools:
    desc: Generate coverage for ./tools from all tests
    env:
      AM_TEST_RUNNER: 1
    ignore_error: true
    cmds:
      - task test --  
          -p 1 --parallel 1
          -tags integration
          -coverprofile=coverage-tools.txt -coverpkg=./tools/...
      - go tool cover -func=coverage-tools.txt | grep total | awk '{print $3}' >
          coverage-tools.sum.txt

  test-coverage-pkg:
    desc: Generate coverage for ./pkg from all tests
    env:
      AM_TEST_RUNNER: 1
    ignore_error: true
    cmds:
      - task test --  
          -p 1 --parallel 1
          -tags integration
          -coverprofile=coverage-pkg.txt -coverpkg=./pkg/...
      - go tool cover -func=coverage-pkg.txt | grep total | awk '{print $3}' >
          coverage-pkg.sum.txt

  test-coverage-machine:
    desc: Generate coverage for ./pkg/machine from all tests
    env:
      AM_TEST_RUNNER: 1
    ignore_error: true
    cmds:
      - task test --  
          -p 1 --parallel 1
          -tags integration
          -coverprofile=coverage-pkg-machine.txt -coverpkg=./pkg/machine
      - go tool cover -func=coverage-pkg-machine.txt | grep total | awk '{print $3}' >
          coverage-pkg-machine.sum.txt

  test-series:
    env:
      AM_TEST_RUNNER: 1
    desc: Run all local tests in a series
    cmds:
      - task: link-pubsub
      - task: clean-test
      - go test -p 1 --parallel 1 ./... {{.CLI_ARGS}}
      - cd ./pkg/pubsub && go test -p 1 --parallel 1 ./... {{.CLI_ARGS}}

  test-race:
    env:
      AM_TEST_RUNNER: 1
      AM_DETECT_EVAL: 1
    desc: Run all local tests with -race
    cmds:
      - task: link-pubsub
      - task: clean-test
      - go test -v -race ./... {{.CLI_ARGS}}
      - cd ./pkg/pubsub && go test -v -race ./... {{.CLI_ARGS}}

  test-debugger:
    desc: Run local am-dbg integration tests
    cmds:
      - task: clean-test
      - go test
        ./tools/debugger/test {{.CLI_ARGS}}

  test-debugger-remote:
    dotenv:
      - config/env/tests-remote.env
    desc: Run remote am-dbg integration tests against a running worker (see task am-dbg-worker)
    cmds:
      - task: clean-test
      - go test -tags test_worker
          ./tools/debugger/test/remote {{.CLI_ARGS}}

  test-pubsub-trace:
    desc: Run the pubsub load test with tracing
    dir: pkg/pubsub
    cmds:
      - task: link-pubsub
      - task: clean-test
      - go test -trace=trace.out -test.run '^\QTestExposingMany\E$' -v
      - go tool trace trace.out

  precommit:
    cmds:
      - go mod tidy
      - task: tidy-pubsub
      - task: link-pubsub
      - task: clean
      - task: format
      - task: test-all
      - task: test-race

  clean-lint:
    cmd: golangci-lint cache clean

  clean-test:
    cmd: go clean -testcache

  clean:
    cmds:
      - task: clean-test
      - task: clean-lint

  cloc-go-total: gocloc --output-type json
    . |
    jq '.languages[] | select(.name == "Go").code' |
    task script-compact-number

  cloc-go-internal: gocloc --output-type json --not-match=_test\.go
    internal |
    jq '.languages[] | select(.name == "Go").code' |
    task script-compact-number

  cloc-go-tools: gocloc --output-type json --not-match=_test\.go
    tools |
    jq '.languages[] | select(.name == "Go").code' |
    task script-compact-number

  cloc-go-pkg: gocloc --output-type json --not-match=_test\.go --not-match-d=symbols
    pkg |
    jq '.languages[] | select(.name == "Go").code' |
    task script-compact-number

  cloc-go-examples: gocloc --output-type json
    examples |
    jq '.languages[] | select(.name == "Go").code' |
    task script-compact-number

  cloc:
    cmds:
      - printf "\n----- pkg/machine\n\n"
      - gocloc pkg/machine --not-match=_test\.go
      - gocloc pkg/machine --match=_test\.go

      - printf "\n----- pkg/rpc\n\n"
      - gocloc pkg/rpc --not-match=_test\.go
      - gocloc pkg/rpc --match=_test\.go

      - printf "\n----- pkg/node\n\n"
      - gocloc pkg/node --not-match=_test\.go
      - gocloc pkg/node --match=_test\.go

      - printf "\n----- pkg/telemetry\n\n"
      - gocloc pkg/telemetry --not-match=_test\.go
      - gocloc pkg/telemetry --match=_test\.go

      - printf "\n----- pkg/history\n\n"
      - gocloc pkg/history --not-match=_test\.go
      - gocloc pkg/history --match=_test\.go

      - printf "\n----- tools/debugger\n\n"
      - gocloc tools/debugger --not-match=_test\.go
      - gocloc tools/debugger --match=_test\.go

      - printf "\n----- tools/generator\n\n"
      - gocloc tools/generator --not-match=_test\.go

      - printf "\n----- examples\n\n"
      - gocloc examples

      - printf "\n----- docs\n\n"
      - gocloc --include-lang=md docs

  format:
    cmds:
      - $GOFMT -w examples/*/*.go
      - $GOFMT -w pkg/**/*.go
      - $GOFMT -w tools/**/*.go
      - goimports -w -local "github.com/pancsta/asyncmachine-go" pkg/**/*.go
      - goimports -w -local "github.com/pancsta/asyncmachine-go" tools/**/*.go

  lint:
    cmds:
      - task: lint-go
      - task: lint-md
      - task: format
      - task: check-fmt
      - '! grep -rn --include="*.go" "TODO DEBUG" .'
      - '! grep -rn --include="*.go"
       --exclude-dir="examples"
       --exclude-dir="yaegi"
        "github.com/gookit/goutil/dump" .'

  lint-ci:
    cmds:
      - task: lint-go
      - task: lint-md

  lint-go: $(go env GOPATH)/bin/golangci-lint run --fix --timeout 15m

  # config in .rumdl.toml
  lint-md:
    cmd: rumdl check . {{.CLI_ARGS}}

  lint-md-fix:
    desc: Fix auto-fixable markdown issues
    cmd: rumdl check --fix . {{.CLI_ARGS}}

  check-fmt:
    silent: false
    cmds:
      - test -z "$($GOFMT -l examples/**/*.go)"
      - test -z "$($GOFMT -l pkg/**/*.go)"
      - test -z "$($GOFMT -l tools/**/*.go)"
      - test -z "$(goimports -l -local "github.com/pancsta/asyncmachine-go" pkg/**/*.go)"
      - test -z "$(goimports -l -local "github.com/pancsta/asyncmachine-go" tools/**/*.go)"

  gen-changelog: task script-gen-changelog > CHANGELOG.md

  install-am-dbg: go install ./tools/cmd/am-dbg
  install-arpc: go install ./tools/cmd/arpc
  install-am-relay: go install ./tools/cmd/am-relay
  install-am-vis: go install ./tools/cmd/am-vis
  install-am-gen: go install ./tools/cmd/am-gen

  install-deps-ci:
    cmds:
      - go mod tidy
      - task: tidy-pubsub
      - task: link-pubsub
      - go install github.com/hhatto/gocloc/cmd/gocloc@latest

  install-deps:
    desc: Install project dependencies
    cmds:
      - go mod tidy
      - task: tidy-pubsub
      - task: link-pubsub
      - go install github.com/mattn/goreman@latest
      - go install github.com/hhatto/gocloc/cmd/gocloc@latest
      - task: install-deps-linter

  install-deps-db:
    desc: Install database tools
    cmds:
      - go install github.com/devilcove/bboltEdit@latest
      - uv tool install squall_sql

  install-deps-docs:
    desc: Install documentation dependencies
    cmds:
      - go install go101.org/golds@latest
      # TODO use go module
      - curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
      - chmod +x tailwindcss-linux-x64
      - mv tailwindcss-linux-x64 ~/.local/bin/tailwindcss

  install-deps-scripts:
    desc: Install go.mod for /scripts
    dir: scripts
    cmd: go mod tidy

  am-gen-states:
    desc: Generate a schema file in ROOT DIR for provided state names, eg "task am-gen-states -- -s Foo,Bar -n MyMach"
    cmds:
      - go run ./tools/cmd/am-gen states-file {{.CLI_ARGS}}

  am-gen-schema-yaml:
    desc: Generate a schema file in ROOT DIR from a YAML file, eg "task am-gen-schema-yaml -- schema.yml -n MyMach"
    cmds:
      - go run ./tools/cmd/am-gen schema-yaml {{.CLI_ARGS}}

  am-gen-grafana:
    desc: Generate a Grafana dashboard, eg "task am-gen-grafana -- --ids mymach,rm-mymach --name mymach --source my-service"
    cmds:
      - go run ./tools/cmd/am-gen grafana {{.CLI_ARGS}}

  install-deps-linter:
    cmds:
      - uv tool install --force rumdl
      - go install mvdan.cc/gofumpt@latest
      - go install golang.org/x/tools/cmd/goimports@latest
      - curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh 
          | sh -s -- -b $(go env GOPATH)/bin latest

  godoc: godoc -http=:6060

  gen-docs-manual-pdf:
    cmds:
      - >-
        docker run --rm -v "$(pwd):/data" pandoc/extra \
          -f markdown-implicit_figures docs/manual.md \
          -o manual.pdf
      - mv -f manual.pdf assets/asyncmachine-go/manual.pdf

  prof-cpu-img:
    cmds:
      - go tool pprof -png cpu.prof > cpu.light.png
      - magick cpu.light.png
        -channel RGB -negate cpu.dark.png

  prof-mem-img:
    cmds:
      - go tool pprof -png mem.prof > mem.light.png
      - magick mem.light.png
          -channel RGB -negate mem.dark.png

  prof-cpu:
    requires:
      vars: [ SEC ]
    cmds:
      - curl -s http://localhost:6060/debug/pprof/profile?seconds={{.SEC}} > cpu.prof
      - task: prof-cpu-img

  prof-mem:
    cmds:
      - curl -s http://localhost:6060/debug/pprof/heap > mem.prof
      - task: prof-mem-img

  prof-mem-srv:
    cmds:
      - task: prof-mem
      - go tool pprof -http :9999 -edgefraction 0 -nodefraction 0 -nodecount 100000 mem.prof

  prof-trace:
    requires:
      vars: [ SEC ]
    cmds:
      - curl -s http://localhost:6060/debug/pprof/trace?seconds={{.SEC}} > trace.out
      - go tool trace -http=:42419 trace.out

  benchmark-grpc-build:
    dir: examples/benchmark_grpc
    cmd: protoc --go_out=. --go_opt=paths=source_relative
           --go-grpc_out=. --go-grpc_opt=paths=source_relative
           proto/worker.proto

  benchmark-grpc:
    dir: examples/benchmark_grpc
    env:
      GOWORK: "off"
    cmds:
      - echo "Running 10_000 server events"
      - go test -bench=. -benchtime=10000x -v

  web-metrics:
    cmds:
      - docker-compose -f deploy/web-metrics/docker-compose.yml up -d --force-recreate
      - |
        echo Grafana: http://localhost:3000
        echo Jaeger: http://localhost:16686

  web-metrics-clean:
    cmd: docker-compose -f deploy/web-metrics/docker-compose.yml down -v

  gen-grafana-tree-state-source:
    cmd: ./examples/tree_state_source/gen-grafana.sh

  arpc:
    silent: true
    desc: Start an aRPC REPL
    cmd: go run ./tools/cmd/arpc
        {{.CLI_ARGS}}

  dashboard-full:
    vars:
      AM_REPL_DIR: '{{.AM_REPL_DIR | default "./tmp"}}'
      AM_DBG_ADDR: '{{.AM_DBG_ADDR | default ":6831"}}'
    env:
      AM_REPL_DIR: "{{.AM_REPL_DIR}}"
      AM_DBG_ADDR: "{{.AM_DBG_ADDR}}"
    desc: Start a dashboard with 4 instances of am-dbg
    ignore_error: true
    cmds:
      - task: build-am-dbg
      - task: build-arpc
      - task: dashboard-exit
      - zellij --session am-dashboard 
          --new-session-with-layout ./config/dashboards/dash-full.kdl
      - task: dashboard-exit

  dashboard-wide-narrow:
    vars:
      AM_DBG_ADDR: '{{.AM_DBG_ADDR | default ":6831"}}'
    env:
      AM_DBG_ADDR: "{{.AM_DBG_ADDR}}"
    desc: Start a dashboard with 2 instances of am-dbg
    ignore_error: true
    cmds:
      - task: build-am-dbg
      - task: dashboard-exit
      - zellij --session am-dashboard 
        --new-session-with-layout ./config/dashboards/dash-wide-narrow.kdl
      - task: dashboard-exit

  dashboard-repl:
    silent: false
    vars:
      AM_REPL_DIR: '{{.AM_REPL_DIR | default "./tmp"}}'
      AM_DBG_ADDR: '{{.AM_DBG_ADDR | default ":6831"}}'
    env:
      AM_REPL_DIR: "{{.AM_REPL_DIR}}"
      AM_DBG_ADDR: "{{.AM_DBG_ADDR}}"
    desc: Start a dashboard with am-dbg and a REPL
    ignore_error: true
    cmds:
      - task: build-am-dbg
      - task: build-arpc
      - echo $AM_DBG_ADDR
      - task: dashboard-exit
      - zellij --session am-dashboard 
          --new-session-with-layout ./config/dashboards/dash-repl.kdl
      - task: dashboard-exit

  dashboard-wn-repl:
    vars:
      AM_REPL_DIR: '{{.AM_REPL_DIR | default "./tmp"}}'
      AM_DBG_ADDR: '{{.AM_DBG_ADDR | default ":6831"}}'
    env:
      AM_REPL_DIR: "{{.AM_REPL_DIR}}"
      AM_DBG_ADDR: "{{.AM_DBG_ADDR}}"
    desc: Start a dashboard with 2 instances of am-dbg and a REPL
    ignore_error: true
    cmds:
      - task: build-am-dbg
      - task: build-arpc
      - task: dashboard-exit
      - zellij --session am-dashboard 
          --new-session-with-layout ./config/dashboards/dash-wide-narrow-repl.kdl
      - task: dashboard-exit

  dashboard-exit:
    desc: Exit Zellij dashboard
    cmd: zellij delete-session am-dashboard --force

  gen-docs-jsonschema:
    desc: Generate JSON schemas for pkg/integrations
    dir: scripts
    cmd: go run ./gen_jsonschema

  web-dashboard-ttyd:
    silent: false
    env:
      AM_REPL_DIR: "{{.AM_REPL_DIR}}"
    requires:
      vars: [AM_REPL_DIR, AM_DBG_BASE_PATH]
    cmds:
      - ttyd --writable
          -t titleFixed="am-dbg"
          -t disableLeaveAlert=true
          -t disableResizeOverlay=true
          --base-path {{.AM_DBG_BASE_PATH}}
          zellij attach am-dashboard

  web-dashboard-repl:
    silent: false
    env:
      AM_REPL_DIR: "{{.AM_REPL_DIR}}"
      AM_DBG_ADDR: "{{.AM_DBG_ADDR}}"
    desc: Start a web dashboard with am-dbg and a REPL (to be ran in Docker)
    requires:
      vars: [AM_REPL_DIR]
    ignore_error: true
    cmds:
#      - task: build-am-dbg
      - task: dashboard-exit
      - task web-dashboard-ttyd &
      # set term size TODO update on ttyd connection
      # https://github.com/zellij-org/zellij/issues/2799
      - stty cols 200 rows 100
      - zellij --session am-dashboard 
        --new-session-with-layout ./config/dashboards/dash-repl-web.kdl
      - task: dashboard-exit

  db-bbolt: bboltEdit pkg/history/bbolt/amhist.db
  db-sql: squall pkg/history/gorm/amhist.sqlite

  am-vis: go run ./tools/cmd/am-vis {{.CLI_ARGS}}
  am-relay: go run ./tools/cmd/am-relay {{.CLI_ARGS}}

  gen-docs-api:
    cmds:
      - rm -Rf ./tmp*/call-log
      - task: script-gen-api-docs

  gen-docs-release-notes:
    desc: Generate the release notes
    cmd: task script-gen-release-notes

  gen-docs-website:
    desc: Generate the whole website
    cmds:
      - task: script-gen-website
      - tailwindcss -i docs/website/templates/input.css -o docs/website/output.css
      - magick assets/asyncmachine-go/logo.png
        -background transparent -flatten
        -define icon:auto-resize=256,128,64,48,32,16 docs/website/favicon.ico

  deploy-docs-website:
    requires:
      vars: [AM_DEPLOY_WEBSITE_DIR, AM_DEPLOY_WEBSITE_CODE_DIR]
    cmds:
      - mv docs/website/*.{html,css,ico,md} {{.AM_DEPLOY_WEBSITE_DIR}}
      - cp -R scripts/gen_website/sitemap {{.AM_DEPLOY_WEBSITE_CODE_DIR}}/sitemap_am

  deploy-docs-api:
    requires:
      vars: [AM_DEPLOY_API_DIR]
    cmds:
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/pkg
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/src
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/png
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/jvs
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/imp
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/dep
      - rm -Rf {{.AM_DEPLOY_API_DIR}}/css
      - mv docs/api/* {{.AM_DEPLOY_API_DIR}}

  deploy-assets:
    requires:
      vars: [AM_DEPLOY_ASSETS_DIR]
    cmds:
      - cp -R assets/asyncmachine-go/* {{.AM_DEPLOY_ASSETS_DIR}}

  docs-api:
    desc: Serve local API docs
    cmd: static-server -addr localhost:7324 docs/api

  docs-website:
    desc: Serve local website
    cmd: static-server -addr localhost:1293 docs/website

  gen-docs-netgraph:
    desc: Generate NetworkGraph D2 diagrams for docs
    dir: pkg/graph/test
    cmds:
      - go test -tags integration -run TestNetworkGraphDiagrams -count=1 .
      - cp netgraph.d2 ../../../docs/diagrams/netgraph.d2
      - cp netgraph_ring.d2 ../../../docs/diagrams/netgraph-ring.d2

  gen-docs-diagrams:
    dir: docs/diagrams
    cmds:
      - find . -name "*.d2" -exec d2 --theme=201 --layout=elk {} {}.dark.svg \;
      - d2 --theme=201 --layout=dagre tx-lifecycle.d2 tx-lifecycle.d2.dark.svg
      - find . -name "*.mermaid" -exec mmdc --input {}
          --theme=forest --output={}.light.svg --backgroundColor=transparent \;
      - find . -name "*.mermaid" -exec mmdc --input {}
          --theme=dark --output={}.dark.svg --backgroundColor=transparent \;
      - mv *.svg ../../assets/asyncmachine-go/diagrams

  post-release:
    cmds:
      - task: gen-docs-website
      - task: gen-docs-api
      - task: deploy-docs-website
      - task: deploy-docs-api
      - task: deploy-assets

  gen-docs-skills:
    desc: Generate AI skills in /docs/editors/skills (am, am-cook, am-full, am-readme, am-mini, am-cli)
    dir: scripts
    cmd: go run ./gen_skills

  gen-badges:
    cmds:
      - task: test-coverage-machine
      - task: test-coverage-pkg
      - task: test-coverage-tools
      - task: script-gen-badges

  gen-graph-frogql-wasm:
    desc: Download the frogql-wasm release wasm (default 0.6.0)
    vars:
      FROGQL_VERSION: '{{.FROGQL_VERSION | default "0.6.0"}}'
    status:
      - test -f pkg/graph/frogql/frogql_wasm_bg.wasm
    cmds:
      - curl -sL https://registry.npmjs.org/frogql-wasm/-/frogql-wasm-{{.FROGQL_VERSION}}.tgz
          | tar xz --strip-components=1 -C pkg/graph/frogql package/frogql_wasm_bg.wasm

  gen-graph-frogql:
    desc: Regenerate pkg/graph/frogql/frogql_gen.go from the frogql wasm
    sources:
      - pkg/graph/frogql/frogql_wasm_bg.wasm
    generates:
      - pkg/graph/frogql/frogql_gen.go
    cmds:
      - task: gen-graph-frogql-wasm
      - go run github.com/ncruces/wasm2go@v0.4.20 -tags frogql -pkg frogql
          -o pkg/graph/frogql/frogql_gen.go pkg/graph/frogql/frogql_wasm_bg.wasm

  gen-graph-frogql-update:
    desc: Force-download a frogql-wasm release (default 0.6.0) and regenerate
    vars:
      FROGQL_VERSION: '{{.FROGQL_VERSION | default "0.6.0"}}'
    cmds:
      - rm -f pkg/graph/frogql/frogql_wasm_bg.wasm
      - curl -sL https://registry.npmjs.org/frogql-wasm/-/frogql-wasm-{{.FROGQL_VERSION}}.tgz
          | tar xz --strip-components=1 -C pkg/graph/frogql package/frogql_wasm_bg.wasm
      - task: gen-graph-frogql

  build-frogql:
    desc: Build pkg/graph incl. the embedded frogql DbGraph backend ("frogql" tag)
    cmds:
      - task: gen-graph-frogql
      - go build -tags frogql -o /dev/null ./pkg/graph/...

  test-frogql:
    env:
      AM_TEST_RUNNER: 1
    desc: Run the frogql DbGraph tests ("frogql" tag)
    cmds:
      - task: gen-graph-frogql
      - go test -tags frogql ./pkg/graph/...
      - go test -tags frogql -race ./pkg/graph/...
      - go test -tags frogql,integration ./pkg/graph/test/

  bench-frogql:
    desc: Benchmark DbGraph query TPS on a fully synced graph ("frogql" tag)
    env:
      AM_BENCH_BACKEND: frogql
    cmds:
      - task: gen-graph-frogql
      - go test -tags frogql,integration -run=^$ -bench . -benchtime 2s ./pkg/graph/test/

  test-graph-gochickpeas:
    env:
      AM_TEST_RUNNER: 1
    desc: Run the gochickpeas DbGraph tests (untagged)
    cmds:
      - go test ./pkg/graph/gochickpeas/
      - go test -race ./pkg/graph/gochickpeas/
      - go test -count=1 -tags integration ./pkg/graph/test/

  bench-graph-gochickpeas:
    desc: Benchmark gochickpeas DbGraph query TPS on a fully synced graph
    env:
      AM_BENCH_BACKEND: gochickpeas
    cmds:
      - go test -tags integration -run=^$ -bench . -benchtime 2s ./pkg/graph/test/

  test-graph-gql:
    env:
      AM_TEST_RUNNER: 1
    desc: Run the native GQL DbGraph tests
    cmds:
      - go test ./pkg/graph/gql/
      - go test -race ./pkg/graph/gql/
      - go test -tags integration -count=1 -run 'TestDbServerAuth' ./pkg/graph/test/

  bench-graph-gql:
    desc: Benchmark native GQL DbGraph query TPS on a fully synced graph
    env:
      AM_BENCH_BACKEND: gql
    cmds:
      - go test -tags integration -run=^$ -bench . -benchtime 2s ./pkg/graph/test/

  bench-netgraph-docker:
    desc: Run a NetGraph scale test in Docker (default TestNetGraphFullUDP)
    cmds:
      - ./scripts/run-netgraph-bench-docker.sh {{.CLI_ARGS}}

#  TODO bench-graph

  gen-yaegi-symbols:
    dir: pkg/integrations/yaegi
    cmd: task gen-yaegi-symbols

  #
  #
  # SCRIPTS (different work dir and go.mod)
  #
  #

  script-gen-docs-diagrams-watch:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./watch_diagrams

  script-test-loop:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./test_loop

  script-gen-api-docs:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_api_docs

  script-gen-website:
    requires:
      vars: [AM_DEPLOY_API_URL, AM_DEPLOY_ASSETS_URL]
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_website

  script-gh-stats:
    requires:
      vars: [AM_DEPLOY_WEBSITE_DIR, GITHUB_TOKEN_STATS]
    env:
      GITHUB_TOKEN_STATS: "{{.GITHUB_TOKEN_STATS}}"
    dir: scripts
    deps: [install-deps-scripts]
    cmds:
      - go run ./gh_stats
      - cp ../data/stats.light.png {{.AM_DEPLOY_WEBSITE_DIR}}/chart_light.png
      - cp ../data/stats.dark.png {{.AM_DEPLOY_WEBSITE_DIR}}/chart_dark.png

  script-compact-number:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./compact_number

  script-gen-release-notes:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_release_notes

  script-gen-badges:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_badges

  script-gen-changelog:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_changelog

  script-gen-cli-skill:
    dir: scripts
    deps: [install-deps-scripts]
    cmd: go run ./gen_cli_skill
