version: '3'

dotenv:
  - .env

vars:
  PKG: "github.com/pancsta/asyncmachine-go/examples/wasm"

tasks:
  build:
    desc: Development build
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go mod tidy
      - cp $(go env GOROOT)/lib/wasm/wasm_exec.js ./client
      - go build -tags tinygo -buildvcs=false -o client/main.wasm ./client

  start:
    desc: Build and start server
    silent: true
    deps:
      - build
    cmds:
      - rm -f tmp/*.addr
      - echo "Open http://{{.RELAY_HTTP_ADDR}}"
      - echo ""
      - go run ./server

  build-tinygo:
    desc: Development build with TinyGo
    cmds:
      - go mod tidy
      - cp $(tinygo env TINYGOROOT)/targets/wasm_exec.js ./client
      - tinygo build -target wasm -buildvcs=false -o client/main.wasm ./client

  build-tinygo-prod:
    desc: Optimized build with TinyGo
    cmds:
      - tinygo build -target wasm -no-debug -buildvcs=false -o client/prod.wasm ./client
      - wasm-opt -O3 client/prod.wasm -o client/prod.wasm --enable-bulk-memory-opt

  start-tinygo:
    desc: Build with TinyGo and start server
    silent: true
    deps:
      - build-tinygo
    cmds:
      - rm -f tmp/*.addr
      - echo "Open http://{{.RELAY_HTTP_ADDR}}"
      - echo ""
      - go run ./server

  test-tinygo:
    desc: Integration test with a TinyGo browser client
    env:
      AM_WASM_TINYGO: "1"
      AM_TEST_RUNNER: "1"
    cmds:
      - go mod tidy
      - go test -tags integration -run '^TestWasmExample$' -v -count=1 .

  repl:
    desc: Start REPL for both server and browser
    dir: ../../
    cmd: task arpc -- --dir examples/wasm/tmp

  pprof: go tool pprof -http=:8081 http://localhost:6060/debug/pprof/profile?seconds=10

  build-prod:
    desc: Optimized build
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go build -ldflags="-s -w" -o client/prod.wasm ./client
      - wasm-opt -O3 client/prod.wasm -o client/prod.wasm --enable-bulk-memory-opt

  deps-graph:
    desc: Render dependencies graph in deps-graph.svg
    cmd: godepgraph -tags "wasm,js" -s . | dot -Tsvg -o deps-graph.svg

  deps:
    desc: List dependencies in deps.md
    cmd: go list -deps 
      -f '{{ "{{" }}.ImportPath{{ "}}" }} {{ "{{" }}.Imports{{ "}}" }}'
      -tags wasm,js ./client 
        > deps.md
